const page = document.getElementById("page");
const overlay = document.getElementById("overlay");

function hs(x,y,w,h,H,opts){
  const a = document.createElement(opts.href ? "a" : "button");
  a.className = "hs";
  a.style.left = (x/W*100)+"%";
  a.style.top = (y/H*100)+"%";
  a.style.width = (w/W*100)+"%";
  a.style.height = (h/H*100)+"%";
  if(opts.label) a.setAttribute("aria-label",opts.label);
  if(opts.href){
    a.href = opts.href;
    if(/^https?:/.test(opts.href)){a.target="_blank";a.rel="noopener"}
  }
  if(opts.click) a.addEventListener("click",e=>{e.preventDefault();opts.click()});
  page.appendChild(a);
}

function go(route){ location.hash = "#/"+route; }

function render(){
  const route = (location.hash.replace(/^#\/?/,"")||"home");
  const key = P[route] ? route : "home";
  const d = P[key], H = d.h;
  const [cat,type] = key.split("-");
  closeOverlay();
  page.innerHTML = "";
  const img = document.createElement("img");
  img.className = "bg"; img.src = "assets/"+key+".png"; img.alt = key.replace("-"," ");
  img.width = W; img.height = H;
  page.appendChild(img);

  // Logo -> Home (every page)
  hs(100,0,212,69,H,{href:"#/home",label:"Home"});

  // Header nav bar (Packages / Prep. Guide / FAQ's / About) on category pages
  if(cat!=="home" && cat!=="about"){
    hs(0,69,115,42,H,{label:"Packages",click:()=>openOverlay()});
    hs(115,69,121,42,H,{href:"#/"+cat+"-prep",label:"Prep. Guide"});
    hs(236,69,89,42,H,{href:"#/"+cat+"-faq",label:"FAQ's"});
    hs(325,69,87,42,H,{href:"#/about",label:"About"});
  }

  if(key==="home"){
    // category tiles
    const cx=[38,230], ry=[447,632,818], order=["maternity","newborn","1yr","toddler","7th","debut"];
    order.forEach((c,i)=>hs(cx[i%2],ry[Math.floor(i/2)],147,174,H,{href:"#/"+c+"-packages",label:c}));
    hs(110,1214,176,42,H,{href:LINKS.facebook,label:"Visit our Page"});
  }
  if(key==="about"){
    hs(14,10,54,50,H,{href:"#/home",label:"Home"});
    hs(340,10,58,50,H,{label:"Menu",click:()=>openOverlay(true)});
    hs(67,3102,278,63,H,{href:LINKS.gown,label:"Discover Your Perfect Gown"});
  }
  if(type==="packages" && d.inq){
    d.inq.forEach(([x,y],i)=>hs(x,y,110,25,H,{href:INQUIRE[cat][i],label:"Inquire"}));
  }

  // Footer contact links
  const f = d.foot, links=[LINKS.map,LINKS.phone,LINKS.facebook,LINKS.email];
  f.forEach((y,i)=>hs(55,y-4,305,(i===0?36:30),H,{href:links[i],label:["Address","Phone","Facebook","Email"][i]}));

  window.scrollTo(0,0);
}

/* ---------- Packages overlay ---------- */
["assets/buttons.png","assets/pkg-active.png"].forEach(u=>{new Image().src=u});
function openOverlay(burger){ window.scrollTo(0,0); overlay.classList.toggle("burger",!!burger); overlay.classList.add("open"); }
function closeOverlay(){ overlay.classList.remove("open"); }
const menu = document.getElementById("ovmenu");
CATS.forEach((c,i)=>{
  const a=document.createElement("a");
  a.style.top=(i*100/6)+"%";
  a.href="#/"+c.key+"-packages";
  a.setAttribute("aria-label",c.label);
  menu.appendChild(a);
});
overlay.addEventListener("click",e=>{ if(!menu.contains(e.target)) closeOverlay(); });
menu.addEventListener("click",()=>closeOverlay());
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeOverlay(); });

window.addEventListener("hashchange",render);
render();
